<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://chkkfntakeoohwpaugrr.supabase.co; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <script src="mail-link.js?v=8bd774b"></script>
  <title>Reset password · Spectra</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="account.css?v=8bd774b">
</head>
<body data-mail-mode="reset">
  <main class="box">
    <div class="brand"><img src="../assets/spectra-logo.svg" alt="">Spectra</div>
    <div id="message" role="status"><h1 id="heading">Checking your link…</h1><p id="detail"></p></div>
    <form id="passwordForm" hidden>
      <h1>Choose a new password</h1>
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <p class="msg err" id="status" role="status"></p>
      <button type="submit">Save password</button>
    </form>
    <p><a id="signinLink" href="../#/account">Go to Sign in</a></p>
  </main>
  <script src="../config.js?v=8bd774b"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="client.js?v=8bd774b"></script>
  <script src="callback.js?v=8bd774b"></script>
</body>
</html>
